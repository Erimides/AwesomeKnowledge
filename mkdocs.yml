site_name: LibreThoth
site_url: https://Librethoth.pages.dev/
theme:
  palette:
    scheme: slate
  name: material
    
features: 
    - content.tooltips
    - content.footnote.tooltips
  


    - markdown_extensions:
      - admonition
      - pymdownx.details
      - pymdownx.superfences
      - attr_list
      - pymdownx.emoji:
      - emoji_index: !!python/name:material.extensions.emoji.twemoji
      - emoji_generator: !!python/name:material.extensions.emoji.to_svg
      - footnotes
      - abbr
      - pymdownx.snippets
      - pymdownx.details
      - pymdownx.highlight:
      - anchor_linenums: true
      - line_spans: __span
      - pygments_lang_class: true
      - pymdownx.inlinehilite

   

nav:

  - Inicio: index.md
  - Indice:
    - Privacidad y seguridad: Indice/privsec.md
    - Peliculas y Series: Indice/MovieTV.md
  - Guías:
     - Navegación Básica: Guías/NavBasik.md
     - Github y otros: Guías/installfromrepo.md
     - Peliculas y series:
        - Stremio: Guías/MubiTV/stremio.md
  
    